# Full nginx config for the Base44 preview.
# Workers run as root so they can read the bind-mounted source tree, whose
# directories are not world-readable in the sandbox.
user root;
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Always revalidate: the source tree is edited live in the sandbox.
        add_header Cache-Control "no-store" always;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
