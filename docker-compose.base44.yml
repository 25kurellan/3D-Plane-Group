services:
  web:
    # Static site: serves the repository source directly from the bind mount,
    # so edits to index.html / fdroid/ show up on refresh without a rebuild.
    image: nginx:alpine
    restart: on-failure
    ports:
      - "3000:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./.base44/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    labels:
      base44.project: "My PWA App Store"
      base44.kind: "web"
      base44.port: "3000"
